# Configuration de linux-gpo. Tout est facultatif : le domaine et le contrôleur sont détectés seuls.
[agent]
# domaine = exemple.local
# serveur = dc01.exemple.local
# keytab = /etc/krb5.keytab
# compte = PC01$
# netbios = EXEMPLE
# GPO avec un filtre WMI (non évaluable sous Linux) : exclure (par défaut) ou ignorer le filtre
# filtres_wmi = exclure
# Mise à jour de l'agent (sudo linux-gpo maj) : adresse d'une archive, ou github (par défaut : Console Annuaire du domaine)
# source_maj = https://dc01.exemple.local:8443/linux/linux-gpo.tar.gz
