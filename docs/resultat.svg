<text x="450" y="23" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">zz-debian — résultat après « linux-gpo appliquer »</text>
<text x="18" y="56" fill="#93c5fd" xml:space="preserve">$ linux-gpo resultat</text>
