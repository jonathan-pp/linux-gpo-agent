<text x="18" y="203" fill="#fde68a" xml:space="preserve">sudo :</text>
<text x="18" y="224" fill="#e2e8f0" xml:space="preserve">  zz-util@exemple.local ALL=(root) /usr/bin/systemctl status *</text>
<text x="18" y="245" fill="#e2e8f0" xml:space="preserve">  %zz-linux-admins@exemple.local ALL=(ALL) NOPASSWD: ALL</text>
